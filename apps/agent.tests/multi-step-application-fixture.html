<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Multi-step Application Fixture</title>
  </head>
  <body>
    <main>
      <form aria-label="Candidatura">
        <section data-step="1">
          <label for="full-name">Nome completo *</label>
          <input id="full-name" name="fullName" required autocomplete="name">
          <label for="email">E-mail *</label>
          <input id="email" name="email" type="email" required autocomplete="email">
          <button type="button">Avançar</button>
        </section>
        <section data-step="2" hidden>
          <fieldset>
            <legend>Modelo de trabalho *</legend>
            <label><input type="radio" name="workModel" value="remote" required> Remoto</label>
            <label><input type="radio" name="workModel" value="hybrid"> Híbrido</label>
          </fieldset>
          <button type="button">Revisar</button>
        </section>
      </form>
    </main>
  </body>
</html>
