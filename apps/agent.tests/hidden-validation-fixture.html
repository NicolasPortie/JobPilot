<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Hidden Validation Fixture</title>
  </head>
  <body>
    <form aria-label="Candidatura com validação">
      <label for="years">Quantos anos de experiência com Rust? *</label>
      <input id="years" name="years" inputmode="numeric" required aria-describedby="years-error">
      <p id="years-error" role="alert">Insira uma resposta válida.</p>
      <button type="button">Avançar</button>
    </form>
  </body>
</html>
