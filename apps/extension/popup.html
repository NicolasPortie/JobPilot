<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobPilot</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }

      main { padding: 14px; }
      h1 { margin: 0 0 4px; font-size: 16px; }
      p { margin: 0 0 12px; color: #475569; }
      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        padding: 10px 12px;
        font-weight: 700;
      }
      button:disabled { opacity: .55; }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 8px 9px;
        margin: 4px 0 8px;
        font: inherit;
      }
      label {
        display: block;
        color: #334155;
        font-size: 12px;
        font-weight: 700;
      }
      pre {
        max-height: 220px;
        overflow: auto;
        padding: 10px;
        border-radius: 8px;
        background: white;
        border: 1px solid #e2e8f0;
        font-size: 11px;
      }
      .status { font-size: 12px; margin-bottom: 10px; color: #334155; }
    </style>
  </head>
  <body>
    <main>
      <h1>JobPilot</h1>
      <p>Conecte uma vez. Depois o JobPilot acompanha as abas suportadas em segundo plano.</p>
      <label>API local
        <input id="apiUrl" value="http://localhost:5000/api" />
      </label>
      <div class="status" id="status">Verificando aba...</div>
      <button id="save">Conectar ao JobPilot</button>
      <div style="height: 8px"></div>
      <button id="observe">Testar pagina atual</button>
      <pre id="output"></pre>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
