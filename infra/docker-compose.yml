services:
  postgres:
    image: postgres:16-alpine
    container_name: jobpilot-postgres
    environment:
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: ${JOBPILOT_POSTGRES_PASSWORD:?Set JOBPILOT_POSTGRES_PASSWORD or run scripts/start-mvp.ps1}
      POSTGRES_DB: jobpilot
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - jobpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jobpilot_pgdata:
