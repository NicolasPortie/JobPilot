<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste de Candidatura</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .field-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 12px 24px; font-size: 16px; background: #0073b1; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #005a8e; }
    </style>
</head>
<body>
    <h1>Formulário de Candidatura</h1>
    <form id="application-form">
        <div class="field-group">
            <label for="fullname">Nome completo *</label>
            <input type="text" id="fullname" name="fullname" required autocomplete="name">
        </div>
        <div class="field-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="field-group">
            <label for="phone">Telefone *</label>
            <input type="text" id="phone" name="phone" required placeholder="(99) 99999-9999" autocomplete="tel">
        </div>
        <div class="field-group">
            <label for="cpf">CPF *</label>
            <input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}">
        </div>
        <div class="field-group">
            <label for="birthdate">Data de nascimento *</label>
            <input type="text" id="birthdate" name="birthdate" required placeholder="DD/MM/AAAA">
        </div>
        <div class="field-group">
            <label for="city">Cidade *</label>
            <input type="text" id="city" name="city" required autocomplete="address-level2">
        </div>
        <div class="field-group">
            <label for="linkedin">LinkedIn</label>
            <input type="text" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/...">
        </div>
        <button type="submit" id="submit-btn">Enviar candidatura</button>
    </form>
</body>
</html>
