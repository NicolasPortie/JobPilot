<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Custom Select Upload Fixture</title>
  </head>
  <body>
    <form aria-label="Candidatura com upload">
      <button type="button" role="combobox" aria-expanded="false" aria-required="true">
        Você possui experiência com Java? * Selecionar opção
      </button>
      <label for="resume">Currículo *</label>
      <input id="resume" name="resume" type="file" required>
      <button type="button">Enviar candidatura</button>
    </form>
  </body>
</html>
